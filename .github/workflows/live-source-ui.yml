name: Real optional-source UI acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-ui:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Select simulator and record tools
        run: |
          mkdir -p TestResults
          xcodebuild -version | tee TestResults/toolchain.txt
          xcrun simctl list devices available -j > /tmp/devices.json
          UDID=$(python3 -c 'import json; d=json.load(open("/tmp/devices.json")); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS-26-2" in k for v in vs if v["name"] == "iPhone 16 Pro"))')
          echo "SIMULATOR_ID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Real source opt-in, search, playback and UI clock
        run: |
          set -o pipefail
          xcodebuild test -project Zuneviu.xcodeproj -scheme Zuneviu \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:ZuneviuUITests/LiveCatalogUITests/testRealSaavnSearchAndPlaybackUI \
            -parallel-testing-enabled NO -derivedDataPath DerivedData \
            -resultBundlePath TestResults/Glass.xcresult CODE_SIGNING_ALLOWED=NO \
            | tee TestResults/live-source-ui.log
      - name: Export UI attachments
        if: always()
        run: |
          if [ -d TestResults/Glass.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults/Glass.xcresult --output-path TestResults/UIShots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-source-ui-evidence
          path: TestResults/
          retention-days: 1
