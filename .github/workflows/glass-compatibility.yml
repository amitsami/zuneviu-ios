name: Glass footer and iOS 15 compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glass:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native-glass
            xcode: Xcode_26.2.app
            runtime: iOS-26-2
            device: iPhone 16 Pro
          - name: material-fallback
            xcode: Xcode_16.4.app
            runtime: iOS-18-5
            device: iPhone SE (3rd generation)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Select simulator and record tools
        run: |
          mkdir -p TestResults
          xcodebuild -version | tee TestResults/toolchain.txt
          xcrun simctl list devices available -j > /tmp/devices.json
          UDID=$(python3 -c 'import json; d=json.load(open("/tmp/devices.json")); print(next(v["udid"] for k,vs in d["devices"].items() if "${{ matrix.runtime }}" in k for v in vs if v["name"] == "${{ matrix.device }}"))')
          echo "SIMULATOR_ID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Test offline behavior and footer on minimum-target build
        run: |
          set -o pipefail
          xcodebuild test -project Zuneviu.xcodeproj -scheme Zuneviu \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -skip-testing:ZuneviuTests/LiveProviderTests \
            -skip-testing:ZuneviuTests/LiveSaavnTests \
            -skip-testing:ZuneviuUITests/LiveCatalogUITests \
            -parallel-testing-enabled NO \
            -derivedDataPath DerivedData -resultBundlePath TestResults/Glass.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee TestResults/test.log
      - name: Real optional-source playback, download and offline acceptance
        if: success()
        run: |
          set -o pipefail
          xcodebuild test -project Zuneviu.xcodeproj -scheme Zuneviu \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:ZuneviuTests/LiveSaavnTests \
            -parallel-testing-enabled NO -derivedDataPath DerivedData \
            -resultBundlePath TestResults/LiveSaavn.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee TestResults/live-saavn.log
      - name: Capture real online home UI (not playback proof)
        if: success()
        run: |
          xcrun simctl install "$SIMULATOR_ID" DerivedData/Build/Products/Debug-iphonesimulator/Zuneviu.app
          xcrun simctl terminate "$SIMULATOR_ID" com.zuneviu.ios || true
          xcrun simctl launch "$SIMULATOR_ID" com.zuneviu.ios --live-ui-testing
          sleep 15
          xcrun simctl io "$SIMULATOR_ID" screenshot TestResults/Online-home.png
      - name: Build unsigned iPhone release with iOS 15 target
        if: matrix.name == 'native-glass'
        run: |
          set -o pipefail
          xcodebuild build -project Zuneviu.xcodeproj -scheme Zuneviu -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO | tee TestResults/device-build.log
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' DeviceDerivedData/Build/Products/Release-iphoneos/Zuneviu.app/Info.plist | tee TestResults/minimum-os.txt
      - name: Export UI attachments
        if: always()
        run: |
          if [ -d TestResults/Glass.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults/Glass.xcresult --output-path TestResults/UIShots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-${{ matrix.name }}-evidence
          path: TestResults/
          retention-days: 1
